<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Turbo Kart Rally</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#1a1e5a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Turbo Kart Rally" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="touch-controls" hidden>
      <div class="touch-row">
        <button id="touch-left" type="button" aria-label="Steer left">&#9664;</button>
        <button id="touch-right" type="button" aria-label="Steer right">&#9654;</button>
      </div>
      <div id="touch-extra">
        <button id="touch-item" type="button" aria-label="Use item">ITEM</button>
        <button id="touch-drift" type="button" aria-label="Drift">DRIFT</button>
      </div>
      <div class="touch-row">
        <button id="touch-brake" type="button" aria-label="Brake">BRAKE</button>
        <button id="touch-gas" type="button" aria-label="Accelerate">GAS</button>
      </div>
    </div>
    <div id="hud-buttons" hidden>
      <button id="hud-pausebtn" type="button" aria-label="Pause">&#10074;&#10074;</button>
      <button id="hud-mutebtn" type="button" aria-label="Mute">&#128266;</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
  </script>
</body>
</html>
